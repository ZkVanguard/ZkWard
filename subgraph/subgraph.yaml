specVersion: 1.0.0
description: >
  ZkWard Standardized Vault subgraph — proposed standard for AI-managed
  vaults. Two data sources (CommunityPool full-featured + SimpleUsdcVault
  minimal) both project into the same Pool / Transaction / Member entity
  shape, proving the schema is truly cross-protocol: one query works for
  both contracts, and drops onto any competitor AI vault that emits the
  same events.
repository: https://github.com/ZkVanguard/zkward-ethglobal
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: CommunityPool
    network: sepolia
    source:
      # Sepolia legacy CommunityPool proxy — full-featured (rebalances,
      # hedges, fees). Currently dormant; kept for the schema completeness.
      address: "0x07d68C2828F35327d12a7Ba796cCF3f12F8A1086"
      abi: CommunityPool
      startBlock: 11642204
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/community-pool.ts
      entities:
        - Pool
        - NavSnapshot
        - PoolAllocation
        - Rebalance
        - RebalanceTrade
        - Hedge
        - Transaction
        - Member
      abis:
        - name: CommunityPool
          file: ./abis/CommunityPool.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256,uint256,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256,uint256,uint256)
          handler: handleWithdrawn
        - event: Rebalanced(indexed address,uint256[4],uint256[4],string,uint256)
          handler: handleRebalanced
        - event: RebalanceTradeExecuted(indexed uint8,uint256,uint256,bool,uint256)
          handler: handleRebalanceTradeExecuted
        - event: AllocationUpdated(indexed uint8,uint256,uint256)
          handler: handleAllocationUpdated
        - event: PoolHedgeOpened(indexed bytes32,uint8,uint256,uint256,bool,string)
          handler: handlePoolHedgeOpened
        - event: PoolHedgeClosed(indexed bytes32,int256,string)
          handler: handlePoolHedgeClosed
        - event: FeesCollected(uint256,uint256,uint256)
          handler: handleFeesCollected
        - event: FeesWithdrawn(indexed address,uint256,uint256)
          handler: handleFeesWithdrawn
        - event: MemberJoined(indexed address,uint256)
          handler: handleMemberJoined
  - kind: ethereum/contract
    name: SimpleUsdcVault
    network: sepolia
    source:
      # Placeholder — replaced with the real Sepolia deploy address after
      # `scripts/deploy/deploy-sepolia-usdc-full.cjs` completes.
      address: "0x68eee8378935a90343347f5e4438eaad4b53111b"
      abi: SimpleUsdcVault
      startBlock: 11660806
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/simple-usdc-vault.ts
      entities:
        - Pool
        - Transaction
        - Member
      abis:
        - name: SimpleUsdcVault
          file: ./abis/SimpleUsdcVault.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256)
          handler: handleSimpleDeposited
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleSimpleWithdrawn
