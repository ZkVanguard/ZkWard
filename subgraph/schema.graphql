"""
ZkWard Standardized Vault Schema — proposed standard for AI-managed vaults.

Inspired by Messari's Standardized Subgraphs (DEX, Lending, Vaults) but
extended for the AI-managed-vault category: rebalance events carry a
reason hash (bytes32 keccak of the AI decision reasoning), hedges have
their own lifecycle, fees split management vs performance.

The goal is category-creating standards work: one query pattern that
works across every AI-managed vault protocol on every chain. Deploy
this schema for our CommunityPool.sol on Cronos, Sepolia, Hedera; any
future AI vault (competitor or not) that implements the same events
gets first-class support in a single dashboard query.
"""

# ─── Core: Pool ────────────────────────────────────────────────────────────

type Pool @entity(immutable: false) {
  """Contract address of the pool proxy."""
  id: Bytes!

  """Chain the pool is deployed on (network name)."""
  network: String!

  """Total shares issued (updated on every deposit / withdraw)."""
  totalShares: BigInt!

  """Current NAV in the deposit-token base units (e.g. 6-decimal USDT)."""
  totalNav: BigInt!

  """Latest share price in 1e18 fixed-point."""
  sharePrice: BigInt!

  """Number of unique members with a non-zero share balance."""
  memberCount: Int!

  """Total fees collected over pool lifetime (management + performance, base units)."""
  totalFeesCollected: BigInt!

  """Latest allocation targets, one entry per asset."""
  allocations: [PoolAllocation!]! @derivedFrom(field: "pool")

  """All snapshots — timeseries."""
  navSnapshots: [NavSnapshot!]! @derivedFrom(field: "pool")

  """All rebalance events."""
  rebalances: [Rebalance!]! @derivedFrom(field: "pool")

  """All hedges — lifecycle (open/close)."""
  hedges: [Hedge!]! @derivedFrom(field: "pool")

  """All deposits + withdrawals — flat activity feed."""
  transactions: [Transaction!]! @derivedFrom(field: "pool")

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

# ─── NAV Timeseries ────────────────────────────────────────────────────────

type NavSnapshot @entity(immutable: true) {
  """{pool.id}-{blockNumber}-{logIndex}"""
  id: Bytes!
  pool: Pool!
  totalNav: BigInt!
  totalShares: BigInt!
  sharePrice: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# ─── Allocations (latest per asset) ────────────────────────────────────────

type PoolAllocation @entity(immutable: false) {
  """{pool.id}-{assetIndex}"""
  id: Bytes!
  pool: Pool!
  assetIndex: Int!
  """Basis points (0-10000)."""
  targetBps: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

# ─── Rebalance Events ──────────────────────────────────────────────────────

type Rebalance @entity(immutable: true) {
  """{txHash}-{logIndex}"""
  id: Bytes!
  pool: Pool!
  executor: Bytes!
  """Old allocation bps per asset (index 0..NUM_ASSETS-1)."""
  previousBps: [BigInt!]!
  newBps: [BigInt!]!
  """Off-chain audit reference (URL or hex hash) — points at the AI reasoning log."""
  reasonHash: String!
  """Trades executed as part of this rebalance."""
  trades: [RebalanceTrade!]! @derivedFrom(field: "rebalance")
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type RebalanceTrade @entity(immutable: true) {
  """{txHash}-{logIndex}"""
  id: Bytes!
  rebalance: Rebalance!
  assetIndex: Int!
  amountIn: BigInt!
  amountOut: BigInt!
  isBuy: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# ─── Hedge Lifecycle ───────────────────────────────────────────────────────

enum HedgeStatus {
  OPEN
  CLOSED
}

type Hedge @entity(immutable: false) {
  """hedgeId (bytes32 from the pool's PoolHedgeOpened event)."""
  id: Bytes!
  pool: Pool!
  pairIndex: Int!
  """Amount posted as collateral (deposit-token base units)."""
  collateralAmount: BigInt!
  leverage: BigInt!
  isLong: Boolean!
  status: HedgeStatus!
  openReasonHash: String!
  closeReasonHash: String
  """Realized PnL at close, signed (negative = loss). Null while OPEN."""
  realizedPnl: BigInt
  openedAtBlock: BigInt!
  openedAtTimestamp: BigInt!
  closedAtBlock: BigInt
  closedAtTimestamp: BigInt
  openedInTx: Bytes!
  closedInTx: Bytes
}

# ─── Transactions (flat deposit + withdraw feed) ───────────────────────────

enum TransactionType {
  DEPOSIT
  WITHDRAW
  FEES_COLLECTED
  FEES_WITHDRAWN
}

type Transaction @entity(immutable: true) {
  """{txHash}-{logIndex}"""
  id: Bytes!
  pool: Pool!
  type: TransactionType!
  actor: Bytes!
  """For DEPOSIT / WITHDRAW / FEES_WITHDRAWN — amount in deposit-token base units."""
  amount: BigInt!
  """For DEPOSIT — shares minted; for WITHDRAW — shares burned. Zero otherwise."""
  shares: BigInt!
  """Share price at the time (1e18 fixed-point). Zero for fee events."""
  sharePrice: BigInt!
  """For FEES_COLLECTED — split-out management vs performance amounts."""
  managementFeeAmount: BigInt
  performanceFeeAmount: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# ─── Members (per-user aggregate) ──────────────────────────────────────────

type Member @entity(immutable: false) {
  """{pool.id}-{memberAddress}"""
  id: Bytes!
  pool: Pool!
  address: Bytes!
  currentShares: BigInt!
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
  joinedAtBlock: BigInt!
  joinedAtTimestamp: BigInt!
  lastActionAtBlock: BigInt!
  lastActionAtTimestamp: BigInt!
}
