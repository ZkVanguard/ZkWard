specVersion: 1.0.0
description: >
  Real subgraph.yaml pointing at a Hedera testnet vault. The Graph doesn't
  natively index Hedera — this manifest is loaded by @zkward/hedera-graphql-adapter
  via `fromSubgraphYaml()`, which routes the same declaration to Hedera Mirror
  Node and exposes the standard subgraph GraphQL surface. Consumers get
  identical query ergonomics whether the chain is Graph-indexed or Hedera.
repository: https://github.com/ZkVanguard/zkward-ethglobal
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: SimpleUsdcVault
    network: hedera-testnet
    source:
      address: "0xe7E6fEDce9d72D112137B631E8D51831D30729A9"
      abi: SimpleUsdcVault
      startBlock: 40229981
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./mapping.ts
      entities:
        - Pool
        - Transaction
        - Member
      abis:
        - name: SimpleUsdcVault
          file: ./abis/SimpleUsdcVault.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
