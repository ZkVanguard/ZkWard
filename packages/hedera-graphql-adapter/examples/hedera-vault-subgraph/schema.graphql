scalar BigInt
scalar Bytes

type Pool @entity {
  id: Bytes!
  network: String!
  totalShares: BigInt!
  totalNav: BigInt!
  sharePrice: BigInt!
  memberCount: Int!
}

type Transaction @entity {
  id: Bytes!
  pool: Pool!
  type: String!
  actor: Bytes!
  amount: BigInt!
  shares: BigInt!
  timestamp: BigInt!
}

type Member @entity {
  id: Bytes!
  pool: Pool!
  address: Bytes!
  currentShares: BigInt!
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
}
